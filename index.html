--disp:"Playfair Display",Georgia,"Times New Roman",serif;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{position:relative;margin:0;color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;font-size:1.2rem;line-height:1.5;min-height:100vh;
background:radial-gradient(ellipse at 50% 0%,rgba(46,130,90,.5),transparent 62%),var(--cozy) 0 0/120px 120px,#07291d}
.lights{position:absolute;left:0;right:0;top:0;pointer-events:none;z-index:1}
.lights svg{display:block;width:100%;height:auto}
.b ellipse{filter:drop-shadow(0 0 5px currentColor)}
.b{animation:tw 2.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.5}}
main{max-width:520px;margin:0 auto;padding:70px 16px 44px}
h1{font-family:var(--disp);font-weight:700;font-size:2.3rem;line-height:1.1;margin:6px 0 12px;text-align:center;color:var(--gold);
background:var(--foil);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));user-select:none}
.sub{margin:0 0 30px;text-align:center;color:var(--muted);font-style:italic;font-size:1.25rem;padding-bottom:20px;position:relative}
.sub::after{content:"";position:absolute;left:30%;right:30%;bottom:0;height:5px;background:var(--foil)}
.frame{border:10px solid;border-image:var(--foil) 1;box-shadow:0 22px 50px rgba(0,0,0,.6)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px;background:linear-gradient(180deg,#07291f,#04170f)}
.door{--base:linear-gradient(135deg,#0b3a2a 0%,#1d6a49 40%,#0e4430 58%,#2c8460 78%,#0b3a2a 100%);
aspect-ratio:1;border:0;border-radius:6px;position:relative;cursor:pointer;display:grid;place-items:center;
background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.2) 45%,transparent 62%),var(--stars) 0 0/22px 22px,var(--base);
box-shadow:0 6px 12px rgba(0,0,0,.5);transition:transform .15s}
.door:nth-child(8n+1),.door:nth-child(8n+3),.door:nth-child(8n+6),.door:nth-child(8n+8){--base:linear-gradient(135deg,#6e1020 0%,#b32439 40%,#80182a 58%,#c93a50 78%,#6e1020 100%)}
.n{font-family:var(--disp);font-weight:700;font-size:1.9rem;line-height:1;background:var(--foil);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 2px rgba(0,0,0,.55))}
.door:active{transform:scale(.95)}
.door:focus-visible{outline:3px solid var(--goldl);outline-offset:3px}
.door.locked .n{opacity:.8}
.door.open{background:var(--stars) 0 0/22px 22px,#04170f!important;box-shadow:none}
.door.open .n{opacity:.4;filter:none}
.door.today{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 22px rgba(246,223,151,.75),0 6px 12px rgba(0,0,0,.5)}}
.door.shake{animation:shake .4s}
@keyframes shake{25%{translate:-6px 0}75%{translate:6px 0}}
.count{margin-top:28px;text-align:center;color:var(--muted);font-style:italic}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));translate:-50% 20px;background:var(--cream);color:var(--dark);padding:11px 20px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;z-index:9;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.toast.on{opacity:1;translate:-50% 0}
.veil{position:fixed;inset:0;background:rgba(3,14,9,.9);display:none;align-items:center;justify-content:center;padding:16px;z-index:5;overflow-y:auto}
.veil.on{display:flex}
.card{background:var(--cream);color:var(--dark);padding:30px 24px 24px;max-width:420px;width:100%;text-align:center;border:10px solid;border-image:var(--foil) 1;box-shadow:0 16px 48px rgba(0,0,0,.7);animation:pop .3s ease-out;margin:auto}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.card h2{font-family:var(--disp);font-weight:700;font-size:1.5rem;margin:0 0 12px;color:var(--wine)}
.card p{margin:0 0 20px;font-size:1.35rem;font-weight:500;line-height:1.45}
.photos{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 10px;margin:0 0 22px}
.photos[hidden]{display:none}
.ph{margin:0;background:#fff;padding:7px 7px 22px;box-shadow:0 5px 14px rgba(0,0,0,.45);width:calc(50% - 5px);cursor:zoom-in}
.ph:nth-child(odd){rotate:-2deg}
.ph:nth-child(even){rotate:1.8deg}
.ph img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.photos[data-n="1"] .ph{width:82%}
.photos[data-n="1"] .ph img{aspect-ratio:auto;max-height:48vh;object-fit:contain;background:#fff}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:7}
.zoom{position:fixed;inset:0;background:rgba(3,14,9,.96);display:none;align-items:center;justify-content:center;z-index:8;padding:12px;cursor:zoom-out}
.zoom.on{display:flex}
.zoom img{max-width:100%;max-height:100%;object-fit:contain}
.acts{display:flex;flex-direction:column;align-items:center;gap:8px}
button{font:inherit}
.acts button,.gbox button{font-weight:700;font-size:1.1rem;border:0;border-radius:999px;padding:11px 22px;min-width:74%;cursor:pointer;color:var(--cream);background:linear-gradient(135deg,var(--wine),#b32439 50%,#80182a);box-shadow:0 3px 8px rgba(0,0,0,.35)}
.acts button:not(:first-child){background:rgba(125,18,35,.1);color:var(--wine);box-shadow:none}
.acts button:focus-visible,.gbox button:focus-visible{outline:3px solid var(--goldl);outline-offset:3px}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:80px 24px 24px}
.gate[hidden]{display:none}
.gbox{max-width:360px;width:100%;text-align:center}
.gbox h1{font-size:2.1rem;margin-bottom:12px}
.gbox p{color:var(--muted);margin:0 0 20px}
.gbox input{width:100%;font:inherit;font-size:18px;padding:14px 16px;border-radius:8px;border:0;background:rgba(255,255,255,.1);color:var(--ink);text-align:center;margin-bottom:12px}
.gbox input:focus-visible{outline:3px solid var(--goldl);outline-offset:2px}
.gbox button{width:100%;padding:14px}
.gerr{min-height:1.5em;margin:12px 0 0!important;color:#ffb3bf!important;font-weight:700}
@media (prefers-reduced-motion:reduce){.door.today,.card,.b{animation:none}}
</style>
</head>
<body>
<div class="lights" id="lights"></div>
<div class="gate" id="gate"><div class="gbox" id="gform">

</div></div>

</div></div>

<script>
// À PERSONNALISER : le prénom et les 24 cases (t: m = message, s = souvenir, d = défi)
const NAME = "Martin";
const YEAR = 2026;
const TYPES = {m:["","Message"], s:["","Souvenir"], d:["","Défi du jour"]};
const EXTS = ["jpg","jpeg","png","webp","JPG","JPEG","PNG"];
const fit = box => { box.dataset.n = Math.min(box.children.length, 5); };
function addPhoto(box, base){
  const fig = document.createElement("figure"); fig.className = "ph";
  const im = new Image(); im.alt = ""; im.decoding = "async";
  const cand = /\.\w{3,4}$/.test(base) ? [base] : EXTS.map(e => base + "." + e);
  let k = 0;
  im.onerror = () => { if (++k < cand.length) im.src = cand[k]; else { fig.remove(); fit(box); } };
  im.onload = () => { box.hidden = false; };
  im.onclick = () => { $("zoom").querySelector("img").src = im.currentSrc || im.src; $("zoom").classList.add("on"); };
  im.src = cand[0]; fig.appendChild(im); box.appendChild(fig);
}
// Neige qui tombe du haut de l’écran à l’ouverture d’une case
const cv = document.createElement("canvas"); cv.id = "snow"; document.body.appendChild(cv);
let run = 0;
function snow(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const my = ++run, dpr = Math.min(devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const P = [];
  for (let i = 0; i < 85; i++) {
    const big = Math.random() < .3;
    P.push({x: Math.random() * W, y: -14, d: Math.random() * 90, big,
      s: big ? 6 + Math.random() * 5 : 1.5 + Math.random() * 2.5,
      vy: (big ? 2.4 : 3) + Math.random() * 1.8, ph: Math.random() * 6, sw: .5 + Math.random() * 1.1,
      r: Math.random() * 6, vr: (Math.random() - .5) * .04, c: Math.random() < .2 ? "#f6df97" : "#ffffff"});
  }
  let t = 0;
  (function f(){
    if (my !== run) return;
    g.clearRect(0, 0, W, H); t++;
    let alive = false;
    P.forEach(p => {
      if (t < p.d) { alive = true; return; }
      p.y += p.vy; p.x += Math.sin((t + p.ph * 20) * .04) * p.sw; p.r += p.vr;
      if (p.y > H + 14) return;
      alive = true;
      g.globalAlpha = .9; g.shadowColor = "rgba(255,255,255,.7)"; g.shadowBlur = 6;
      g.save(); g.translate(p.x, p.y);
      if (p.big) {
        g.rotate(p.r); g.strokeStyle = p.c; g.lineWidth = 1.3; g.lineCap = "round";
        for (let k = 0; k < 6; k++) {
          g.rotate(Math.PI / 3); g.beginPath();
          g.moveTo(0, 0); g.lineTo(0, -p.s);
          g.moveTo(0, -p.s * .6); g.lineTo(-p.s * .3, -p.s * .9);
          g.moveTo(0, -p.s * .6); g.lineTo(p.s * .3, -p.s * .9);
          g.stroke();
        }
      } else { g.fillStyle = p.c; g.beginPath(); g.arc(0, 0, p.s / 2, 0, 7); g.fill(); }
      g.restore();
    });
    if (alive) requestAnimationFrame(f); else g.clearRect(0, 0, W, H);
  })();
}
const CLOSE = {
 m:["Ok, c’est mignon","Je fais comme si je n’avais rien lu","Miaou"],
 d:["Ok, je m’en occupe","Peut-être demain","C'est négociable ?","Flemme..."],
 s:["Je m’en souviens très bien","On y retourne quand ?","J’avais complètement oublié","C’était trop bien"]};
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
// Photos : dossier « photos » à côté de index.html. Une ou plusieurs par case (liste), extension facultative (jpg, png, webp…). Les fichiers absents sont ignorés.
const DAYS = [
 {t:"m",p:["photos/chats"],x:"Bienvenue dans ton calendrier de l’avent. Une case par jour, pas de triche. Siah et Phantom ont validé le projet."},
 {t:"d",x:"Prends-toi en photo avec Phantom, comme sur une carte de vœux. Bonus si Phantom est installé sur ton bureau."},

 {t:"s",p:["photos/jo-paris"],x:"Les JO de Paris. On y était, on a crié, on a kiffé. Aujourd’hui, on est à Paris sans foule olympique, et toi tu mérites la médaille du meilleur colloc."},
 {t:"m",x:"Je te laisserais la plus grosse part de pizza. Cherche pas, c’est la preuve d’amour ultime."},
 {t:"d",x:"Ce soir, tu me joues de la guitare, la chanson de ton choix (sauf Sushi Glory Hole)."},
 {t:"s",p:["photos/verbier","photos/verbier2","photos/verbier3"],x:"Verbier, la luge, mon genou. Merci d’avoir été le meilleur infirmier du monde. La revanche sera sans luge et avec raclette."},
 {t:"m",x:"Noël approche, est-ce que tu as trouvé tous tes cadeaux? Sinon c'est passage à Euralille, il est encore temps."},
 {t:"d",x:"Mange un Ferrero Rocher ou un Carambar en pensant à moi. Envoie une photo si tu veux. Les deux en même temps, c’est autorisé."},
 {t:"d",x:"Je suis aux Scouts. Tu es libre de faire une journée gaming et saucisson avec Phantom. Envoie-moi une photo."},
 {t:"d",x:"Marché de Noël. Chacun choisit un truc à goûter pour l’autre. Et on se prend un vin chaud."},

// Ordre mélangé, comme un vrai calendrier
const ORDER = [14,3,22,9,17,1,24,6,12,20,5,15,8,23,2,18,11,4,21,10,16,7,19,13];

const $ = id => document.getElementById(id);
let opened = [], test = false, taps = 0;
try { opened = JSON.parse(localStorage.getItem("avent-ouvertes") || "[]"); } catch(e){}
if (location.hash === "#test") test = true;
$("who").textContent = NAME;

function today(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function unlocked(d){ return test || today() >= new Date(YEAR,11,d); }
function isToday(d){ return today().getTime() === new Date(YEAR,11,d).getTime(); }
function save(){ try{ localStorage.setItem("avent-ouvertes", JSON.stringify(opened)); }catch(e){} }

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove("on"),2200); }

function render(){
  const g=$("grid"); g.innerHTML="";
  ORDER.forEach(d=>{
    const b=document.createElement("button");
    const isOpen=opened.includes(d);
    b.className="door"+(isOpen?" open":"")+(!unlocked(d)?" locked":"")+(isToday(d)&&!isOpen?" today":"");
    b.innerHTML = '<span class="n">' + d + '</span>';
    b.setAttribute("aria-label", isOpen ? "Case "+d+" (déjà ouverte)" : "Case "+d);
    b.onclick=()=>openDoor(d,b);
    g.appendChild(b);
  });
  $("count").textContent = opened.length+" / 24 cases ouvertes" + (test ? " (mode test)" : "");
}

function openDoor(d,b){
  if(!unlocked(d)){
    b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
    toast("Pas avant le "+d+" décembre.");
    return;
  }
  const c=DAYS[d-1], [em,label]=TYPES[c.t];
  $("cem").textContent=em; $("ct").textContent=label+" · "+d+" décembre"; $("cx").textContent=c.x;
  const ph=$("cph"); ph.innerHTML=""; ph.hidden=true;
  [].concat(c.p||[]).forEach(b=>addPhoto(ph,b)); fit(ph);
  const A=$("cacts"); A.innerHTML="";
  shuffle(CLOSE[c.t]).slice(0,3).forEach(l=>{ const b2=document.createElement("button"); b2.textContent=l; b2.onclick=close; A.appendChild(b2); });
  $("veil").classList.add("on"); A.firstChild.focus(); snow();
  if(!test && !opened.includes(d)){ opened.push(d); save(); }
  else if(test && !opened.includes(d)){ opened.push(d); }
}
function close(){ $("veil").classList.remove("on"); render(); }
$("veil").onclick=e=>{ if(e.target===$("veil")) close(); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ $("zoom").classList.remove("on"); close(); } });
$("zoom").onclick=()=>$("zoom").classList.remove("on");

// Mode test : 5 taps sur le titre pour tout débloquer (aperçu pour toi, sans rien sauvegarder)
$("title").onclick=()=>{
  taps++; clearTimeout($("title").h); $("title").h=setTimeout(()=>taps=0,1500);
  if(taps>=5){ taps=0; test=!test; if(test){ opened=[]; } else { try{ opened=JSON.parse(localStorage.getItem("avent-ouvertes")||"[]"); }catch(e){ opened=[]; } }
    toast(test?"Mode test activé":"Mode test désactivé"); render(); }
};
render();

// À PERSONNALISER : le mot de passe (majuscules et espaces ignorés)
const PASSWORD = "MartinMatin";
const ERRORS = ["Raté. C’est pourtant le plus facile.","Non, même pas proche.","Mauvais mot de passe. Un indice ? Demande-moi poliment.","Tu essaies d’entrer chez quelqu’un d’autre ?"];
let errN = 0;
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f\s'’-]/g, "").toLowerCase();
function unlockPage(){ $("gate").hidden = true; $("main").hidden = false; }
try { if (localStorage.getItem("avent-ok") === "1") unlockPage(); } catch(e){}
function tryPw(){
  if (norm($("gpw").value) === norm(PASSWORD)) {
    try { localStorage.setItem("avent-ok", "1"); } catch(e){}
    unlockPage();
  } else {
    $("gerr").textContent = ERRORS[errN++ % ERRORS.length];
    $("gpw").value = ""; $("gpw").focus();
  }
}
$("gbtn").onclick = tryPw;
$("gpw").addEventListener("keydown", e => { if (e.key === "Enter") tryPw(); });

document.getElementById("lights").innerHTML='<svg viewBox="0 0 520 50" aria-hidden="true"><path d="'+p+'" fill="none" stroke="#111" stroke-width="1.6"/>'+b+'</svg>';})();
